<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Beat-The-Track</title>
    <!-- Bootswatch Quartz Theme -->
    <link href="{{ url_for('static', filename='css/quartz-bootstrap.min.css') }}" rel="stylesheet">
  </head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                
                <!-- Die Login-Karte -->
                <div class="card shadow-sm border-0 px-3 py-4">
                    <div class="card-body">
                        
                        <!-- Titel -->
                        <h3 class="card-title text-center mb-4 fw-bold text-dark">Anmelden</h3>
                        
                        <!-- Formular -->
                        <form action="/login" method="POST">
                            
                            <!-- E-Mail / Username Feld -->
                            <div class="mb-3">
                                <label for="email" class="form-label small text-muted fw-semibold">E-Mail</label>
                                <input type="email" class="form-index form-control form-control-lg" id="email" name="username" placeholder="name@beispiel.de" required>
                            </div>
                            
                            <!-- Passwort Feld -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="password" class="form-label small text-muted fw-semibold">Passwort</label>
                                    <a href="#" class="small text-decoration-none text-primary">Vergessen?</a>
                                </div>
                                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••" required>
                            </div>
                                            
                            <!-- Login Button -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold mb-3">Einloggen</button>
                            
                        </form>
                        
                        <!-- Link zur Registrierung -->
                        <div class="text-center mt-3">
                            <p class="small text-muted mb-0">Noch kein Konto? <a href="#" class="text-decoration-none fw-semibold text-primary">Registrieren</a></p>
                        </div>

                    </div>
                </div> <!-- Ende Karte -->

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle via CDN (wichtig für die volle Funktionalität) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
